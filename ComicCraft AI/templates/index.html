<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ComicCraft</title>
<style>body{font-family:Segoe UI;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;margin:0;display:flex;align-items:center;justify-content:center;padding:20px}.container{background:white;border-radius:20px;padding:30px;max-width:600px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,0.3)}h1{text-align:center;color:#333}.subtitle{text-align:center;color:#666;margin-bottom:25px}label{font-weight:600;display:block;margin:12px 0 5px}input,select,textarea{width:100%;padding:12px;border:2px solid #e0e0e0;border-radius:10px;box-sizing:border-box}button{width:100%;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:white;border:none;padding:14px;border-radius:10px;font-size:16px;font-weight:bold;margin-top:20px;cursor:pointer}</style>
</head><body><div class="container"><h1>🎨 ComicCraft</h1><p class="subtitle">AI Comic Story Creator</p>
<form action="/generate" method="post">
<label>Story Prompt *</label><textarea name="story_prompt" required>A brave fox exploring an enchanted forest</textarea>
<label>Character Name</label><input type="text" name="character_name" value="Foxy">
<label>Setting</label><select name="setting"><option value="forest">Forest</option><option value="school">School</option><option value="space">Space</option><option value="city">City</option><option value="enchanted forest" selected>Enchanted Forest</option></select>
<label>Tone</label><select name="tone"><option value="dramatic" selected>Dramatic</option><option value="funny">Funny</option><option value="light-hearted">Light-hearted</option><option value="adventurous">Adventurous</option></select>
<label>Art Style</label><select name="art_style"><option value="comic book" selected>Comic Book</option><option value="anime">Anime</option><option value="realistic">Realistic</option><option value="cartoon">Cartoon</option></select>
<button type="submit">✨ Generate Comic</button>
</form></div></body></html>
